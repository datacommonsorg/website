# Cloud build file to manually trigger building and pushing a CDC data docker image.
# Typically invoked via ./scripts/push_cdc_data_image.sh.
# Substitutions:
#   _TAG: (Required) Image tag to push.
#   _PROJECT_ID: (Optional) Target GCP project for the image registry (defaults to datcom-ci).

steps:

  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: "bash"
    args:
      - -c
      - |
        docker pull gcr.io/datcom-ci/datacommons-data:latest || true

  - id: push-cdc-data-image
    name: gcr.io/cloud-builders/docker
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e
        DOCKER_BUILDKIT=1 docker build -f build/cdc_data/Dockerfile \
          --cache-from gcr.io/datcom-ci/datacommons-data:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --tag gcr.io/${_PROJECT_ID}/datacommons-data:${_TAG} \
          .
        docker push gcr.io/${_PROJECT_ID}/datacommons-data:${_TAG}
    waitFor: ["pull-cache"]

substitutions:
  _TAG: ""
  _PROJECT_ID: "datcom-ci"

timeout: 3600s
options:
  dynamic_substitutions: true
  machineType: "E2_HIGHCPU_32"
