# Deploys the current `stable` Custom DC image to Cloud Run service named `dc-cdc-stable`.
# The service is in the us-central1 region and the datcom-website-dev project.
#
# The deployed image = gcr.io/datcom-ci/datacommons-services:stable
# Cloud run service: https://pantheon.corp.google.com/run/detail/us-central1/dc-cdc-stable/revisions?project=datcom-website-dev
# Cloud run url: https://dc-cdc-stable-496370955550.us-central1.run.app

steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "dc-cdc-stable"
      - "--project"
      - "datcom-website-dev"
      - "--image"
      - "gcr.io/datcom-ci/datacommons-services:stable"
      - "--region"
      - "us-central1"
      - "--update-env-vars"
      - "RESTART_TIMESTAMP=${BUILD_ID}"

tags:
  - "cloudrun--dc-cdc-stable"
