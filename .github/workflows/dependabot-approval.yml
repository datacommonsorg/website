name: Dependabot auto-approve

# Tests and merges Dependabot security update PRs automatically, one PR at a
# time, acting as the datacommons-robot-author GitHub account.
#
# ---------------------------------------------------------------------------
# HOW IT WORKS
# ---------------------------------------------------------------------------
# This file has two independent jobs. They never call each other; they only
# coordinate through each PR's state (auto-merge on or off, labels, and
# comments).
#
# * queue-manager
#   Runs every 30 minutes (and on manual dispatch). Looks at all open
#   Dependabot PRs and moves ONE PR at a time through the queue: labels
#   broken PRs, picks the oldest eligible PR, approves it, turns on
#   auto-merge, and then either posts /gcbrun (PR is up to date) or asks
#   Dependabot to rebase (PR is behind master).
#
# * new-commit-listener
#   Runs whenever a commit is pushed to a PR that targets master. If the PR
#   is the ACTIVE Dependabot PR (usually because Dependabot just finished a
#   rebase that queue-manager asked for), it posts /gcbrun so Cloud Build
#   tests the new commit. Auto-merge is already on, so the PR merges once
#   the tests pass. Every other push is ignored.
#
# Life of one PR:
#
#   queue-manager picks the oldest eligible PR
#     -> approves it and turns on auto-merge
#     -> PR up to date with master?
#          yes -> posts /gcbrun
#          no  -> comments "@dependabot rebase"
#                   -> Dependabot pushes a rebased commit
#                   -> new-commit-listener posts /gcbrun
#     -> Cloud Build passes -> auto-merge merges the PR
#          -> queue-manager waits COOLDOWN_SECONDS, then picks the next PR
#     -> Cloud Build fails  -> next queue-manager run labels it 'failing'
#     -> master changed while testing -> next run requests another rebase
#
# ---------------------------------------------------------------------------
# WHY /gcbrun AND A ROBOT TOKEN
# ---------------------------------------------------------------------------
# * master only accepts a PR whose Cloud Build checks passed on a commit
#   that is up to date with master. Every rebase makes a new commit, so each
#   one needs its own test run.
# * Cloud Build only tests PRs from outside contributors (Dependabot counts
#   as one) after a repo collaborator comments /gcbrun.
# * Comments made with the built-in GITHUB_TOKEN come from
#   github-actions[bot], which is not a collaborator, so Cloud Build
#   ignores them.
# * So both jobs act as datacommons-robot-author (an admin collaborator)
#   using its personal access tokens.
#
# ---------------------------------------------------------------------------
# WHY THERE ARE TWO ROBOT TOKENS
# ---------------------------------------------------------------------------
# GitHub decides which secrets a run can read based on what started it:
# * Runs started by the schedule or by a person can read Actions secrets.
# * Runs started by a Dependabot push can read ONLY Dependabot secrets.
# So each job has its own robot token:
# * queue-manager:       Actions secret    DEPENDABOT_AUTO_MERGE
# * new-commit-listener: Dependabot secret ROBOT_TOKEN_NEW_COMMIT_LISTENER
#   (robot token "website-dependabot-new-commit-listener", Pull requests
#   read and write only)
# Rotate each token before it expires and update its secret.
#
# ---------------------------------------------------------------------------
# SECURITY NOTE
# ---------------------------------------------------------------------------
# new-commit-listener runs with a robot token in response to Dependabot
# pushes. Keep it minimal: no actions/checkout, no third-party actions, and
# no package installs, so dependency code never runs next to the token.
#
# ---------------------------------------------------------------------------
# PR STATES
# ---------------------------------------------------------------------------
# * ACTIVE:     the single PR with auto-merge on. Holds the queue lock.
# * FAILING:    a check failed, or the PR stayed ACTIVE past the lease.
#               Labeled 'failing' and skipped.
# * CONFLICTED: has a conflict Dependabot can't fix. Labeled
#               'merge-conflict' and skipped.
# * Waiting:    every other open Dependabot PR, picked oldest first.
#
# ---------------------------------------------------------------------------
# DEVELOPER INTERVENTIONS
# ---------------------------------------------------------------------------
# * Skip a PR: add the 'ignore' label.
# * Retry a PR: remove 'failing' or 'merge-conflict', click "Enable
#   auto-merge" on the PR, and comment "@dependabot rebase". Turning on
#   auto-merge marks the PR ACTIVE, so new-commit-listener posts /gcbrun
#   after Dependabot rebases.
# * Merge a PR right away: approve and merge it manually in the GitHub UI.

on:
  # Starts new-commit-listener on every push to a PR targeting master. The
  # job's `if:` filters down to Dependabot PRs. Runs started by a Dependabot
  # push can only read Dependabot secrets (see above).
  pull_request:
    types:
      - synchronize
    branches:
      - master
  # Starts queue-manager every 30 minutes.
  schedule:
    - cron: '*/30 * * * *'
  # Starts queue-manager manually ("Run workflow" in the Actions tab).
  workflow_dispatch:

# Default GITHUB_TOKEN permissions. Jobs act through robot tokens instead.
permissions:
  contents: read

env:
  # Pause after a Dependabot PR merges before starting the next one. Also
  # how recent an "@dependabot rebase" comment must be for
  # new-commit-listener to treat that PR as ACTIVE.
  COOLDOWN_SECONDS: 1800
  # If Dependabot hasn't resolved a conflict this long after a rebase
  # request, the PR is labeled 'merge-conflict'.
  REBASE_TIMEOUT_SECONDS: 900
  # An ACTIVE PR older than this (with no new commit in COMMIT_STALE_SECONDS)
  # is treated as stuck and labeled 'failing'.
  ACTIVE_LEASE_TIMEOUT_SECONDS: 7200
  COMMIT_STALE_SECONDS: 3600

jobs:
  # When the ACTIVE Dependabot PR gets a new commit (usually a rebase that
  # queue-manager asked for), post /gcbrun so Cloud Build tests it.
  new-commit-listener:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Run only for Dependabot PRs that haven't been set aside. Every other
    # PR push skips this job. The script below also checks that this PR is
    # the ACTIVE one and that no other Dependabot PR holds the queue.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'datacommonsorg/website' &&
      !contains(github.event.pull_request.labels.*.name, 'failing') &&
      !contains(github.event.pull_request.labels.*.name, 'merge-conflict') &&
      !contains(github.event.pull_request.labels.*.name, 'ignore')
    steps:
      - name: Post /gcbrun comment for Active PR
        env:
          # Robot token from Dependabot secrets. This run was started by a
          # Dependabot push, so Actions secrets are not available here.
          GH_TOKEN: ${{ secrets.ROBOT_TOKEN_NEW_COMMIT_LISTENER }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Only run /gcbrun if this PR was dispatched to Active state
          # (auto-merge enabled or rebased within COOLDOWN_SECONDS), avoiding
          # parallel test runs when Dependabot auto-rebases queued PRs in bulk.
          PR_STATE=$(gh pr view "$PR_URL" \
            --repo "$GITHUB_REPOSITORY" \
            --json autoMergeRequest,comments)

          IS_ACTIVE=$(echo "$PR_STATE" | jq -r \
            --argjson cooldown "$COOLDOWN_SECONDS" '
            (.autoMergeRequest != null) or
            (
              any(
                .comments[]?;
                (.body | test("^\\s*@dependabot rebase\\b")) and
                ((now - (.createdAt | fromdateiso8601)) < $cooldown)
              )
            )
          ')

          if [ "$IS_ACTIVE" != "true" ]; then
            echo "PR is not Active (waiting in queue). Skipping /gcbrun."
            exit 0
          fi

          # Ensure no other un-isolated Dependabot PR already holds the queue
          # lock (e.g. if a developer manually retried this PR via rebase).
          JQ_OTHER_ACTIVE='
            [
              .[] | select(
                (.url != $pr_url) and
                (.autoMergeRequest != null) and
                (
                  all(
                    .labels[].name;
                    . != "failing" and . != "merge-conflict" and . != "ignore"
                  )
                )
              )
            ] | .[0].url // empty
          '
          ACTIVE_OTHER_PR=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --limit 1000 \
            --json url,labels,autoMergeRequest | \
            jq -r --arg pr_url "$PR_URL" "$JQ_OTHER_ACTIVE")

          if [ -n "$ACTIVE_OTHER_PR" ]; then
            echo "Queue locked by $ACTIVE_OTHER_PR. Skipping $PR_URL."
            exit 0
          fi

          gh pr comment "$PR_URL" --body "/gcbrun"

  # Every 30 minutes, move the Dependabot queue forward by one step. Started
  # by the schedule or a person, so it reads its robot token from Actions
  # secrets (DEPENDABOT_AUTO_MERGE).
  queue-manager:
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-approve-and-merge
      cancel-in-progress: false
    permissions:
      pull-requests: write
      contents: write
    if: >-
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch') &&
      github.repository == 'datacommonsorg/website'
    steps:
      # Snapshot open Dependabot PRs (the ACTIVE PR plus the 5 oldest
      # waiting PRs). Later steps read /tmp/dependabot_prs.json.
      - name: Fetch Global Dependabot State
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTO_MERGE }}
        run: |
          # Phase 1: Fetch lightweight PR metadata in bulk (with retries).
          # Avoids GraphQL 502 timeouts caused by querying statusCheckRollup
          # and mergeStateStatus across 80+ PRs at once.
          for ATTEMPT in 1 2 3; do
            if gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --author "app/dependabot" \
              --limit 1000 \
              --json url,createdAt,labels,autoMergeRequest \
              > /tmp/dependabot_all_prs.json; then
              break
            fi
            if [ "$ATTEMPT" -eq 3 ]; then
              echo "Failed to list Dependabot PRs after 3 attempts."
              exit 1
            fi
            sleep $((ATTEMPT * 5))
          done

          # Sort oldest-first (FIFO) and select un-isolated PRs that are:
          # - Currently in the active queue (autoMergeRequest != null), or
          # - Among the first 5 oldest waiting candidates.
          JQ_CANDIDATE_URLS='
            [
              .[] | select(
                all(
                  .labels[].name;
                  . != "failing" and . != "merge-conflict" and . != "ignore"
                )
              )
            ] | sort_by(.createdAt) as $unignored |
            (
              [ $unignored[] | select(.autoMergeRequest != null) ] +
              [ $unignored[] | select(.autoMergeRequest == null) ][0:5]
            ) | map(.url) | .[]
          '

          CANDIDATE_URLS=$(
            jq -r "$JQ_CANDIDATE_URLS" /tmp/dependabot_all_prs.json
          )
          echo "[]" > /tmp/dependabot_prs.json

          # Phase 2: Fetch heavy status/commit/comment fields per candidate.
          JSON_FIELDS="url,createdAt,labels,autoMergeRequest"
          JSON_FIELDS="$JSON_FIELDS,statusCheckRollup,mergeStateStatus"
          JSON_FIELDS="$JSON_FIELDS,commits,comments"

          for PR_URL in $CANDIDATE_URLS; do
            echo "Fetching detailed status for: $PR_URL"
            for ATTEMPT in 1 2 3; do
              if gh pr view "$PR_URL" \
                --repo "$GITHUB_REPOSITORY" \
                --json "$JSON_FIELDS" > /tmp/pr_detail.json; then
                break
              fi
              if [ "$ATTEMPT" -eq 3 ]; then
                echo "Failed to fetch details for $PR_URL after 3 attempts."
                exit 1
              fi
              sleep $((ATTEMPT * 5))
            done
            # Merge via file slurp (-s) to avoid CLI arg length limits (E2BIG).
            jq -s '.[0] + [.[1]]' \
              /tmp/dependabot_prs.json /tmp/pr_detail.json \
              > /tmp/dependabot_prs.tmp.json
            mv /tmp/dependabot_prs.tmp.json /tmp/dependabot_prs.json
          done

      # Label PRs Dependabot can't rebase as 'merge-conflict' and turn off
      # their auto-merge, so they stop holding up the queue.
      - name: Isolate Conflicted PRs
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTO_MERGE }}
        run: |
          # Un-rebased lockfile PRs often report DIRTY until rebased.
          # Only isolate a DIRTY/BEHIND PR as merge-conflict if:
          # 1. It has non-Dependabot commits (Dependabot refuses to rebase), or
          # 2. It is DIRTY and a rebase requested >REBASE_TIMEOUT_SECONDS ago
          #    after the last commit failed to resolve the conflict.
          JQ_CONFLICTED_FILTER='
            .[] | select(
              (all(.labels[].name; . != "merge-conflict" and . != "ignore")) and
              (
                .mergeStateStatus == "DIRTY" or
                .mergeStateStatus == "BEHIND"
              ) and
              (
                # Branch modified by a non-Dependabot user.
                (
                  any(
                    .commits[]?.authors[]?;
                    (.login // "") | test("^dependabot") | not
                  )
                ) or
                # DIRTY PR where rebase was requested >15m after latest commit.
                (
                  (.mergeStateStatus == "DIRTY") and
                  (
                    (
                      ([.commits[]?.committedDate] | last) // ""
                    ) as $last_commit |
                    any(
                      .comments[]?;
                      (.body | test("^\\s*@dependabot rebase\\b")) and
                      (.createdAt > $last_commit) and
                      (
                        (now - (.createdAt | fromdateiso8601)) >
                        $rebase_timeout
                      )
                    )
                  )
                )
              )
            ) | .url
          '

          CONFLICTED_PRS=$(
            jq -r --argjson rebase_timeout "$REBASE_TIMEOUT_SECONDS" \
              "$JQ_CONFLICTED_FILTER" /tmp/dependabot_prs.json
          )

          for CONFLICTED_PR in $CONFLICTED_PRS; do
            echo "State Transition: Isolating conflicted PR: $CONFLICTED_PR"
            gh pr edit "$CONFLICTED_PR" --add-label "merge-conflict" || true
            gh pr merge --disable-auto "$CONFLICTED_PR" || true
            # Drop from local state so later steps don't see stale PRs.
            jq --arg url "$CONFLICTED_PR" 'map(select(.url != $url))' \
              /tmp/dependabot_prs.json > /tmp/dependabot_prs.tmp.json
            mv /tmp/dependabot_prs.tmp.json /tmp/dependabot_prs.json
          done

      # Label PRs with a failed check, or an ACTIVE PR stuck past the lease,
      # as 'failing' and turn off their auto-merge.
      - name: Isolate Failing PRs
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTO_MERGE }}
        run: |
          # Isolate PRs with any failed status check, or active PRs stuck in
          # the queue past ACTIVE_LEASE_TIMEOUT_SECONDS with no new commit in
          # COMMIT_STALE_SECONDS.
          JQ_FAILING_FILTER='
            .[] | select(
              (all(.labels[].name; . != "failing" and . != "ignore")) and
              (
                # Any check run or status context failed.
                any(
                  .statusCheckRollup[]?;
                  .conclusion == "FAILURE" or
                  .conclusion == "ERROR" or
                  .conclusion == "TIMED_OUT" or
                  .conclusion == "CANCELLED" or
                  .conclusion == "ACTION_REQUIRED" or
                  .state == "FAILURE" or
                  .state == "ERROR"
                ) or
                # Active queue lease timeout (2h enabled, 1h since last commit).
                (
                  (.autoMergeRequest != null) and
                  (
                    (
                      now - (.autoMergeRequest.enabledAt | fromdateiso8601)
                    ) > $lease_timeout
                  ) and (
                    (
                      now - (
                        (([.commits[]?.committedDate] | last) // .createdAt) |
                        fromdateiso8601
                      )
                    ) > $commit_stale
                  )
                )
              )
            ) | .url
          '

          FAILING_PRS=$(
            jq -r \
              --argjson lease_timeout "$ACTIVE_LEASE_TIMEOUT_SECONDS" \
              --argjson commit_stale "$COMMIT_STALE_SECONDS" \
              "$JQ_FAILING_FILTER" /tmp/dependabot_prs.json
          )

          for FAILING_PR in $FAILING_PRS; do
            echo "State Transition: Isolating failing PR: $FAILING_PR"
            gh pr edit "$FAILING_PR" --add-label "failing" || true
            gh pr merge --disable-auto "$FAILING_PR" || true
            # Drop from local state so later steps don't see stale PRs.
            jq --arg url "$FAILING_PR" 'map(select(.url != $url))' \
              /tmp/dependabot_prs.json > /tmp/dependabot_prs.tmp.json
            mv /tmp/dependabot_prs.tmp.json /tmp/dependabot_prs.json
          done

      # If a PR is ACTIVE, keep it moving (request a rebase if master moved
      # and its checks finished) and stop. Also stop during the post-merge
      # cooldown. Sets QUEUE_LOCKED=true to skip the dispatch step.
      - name: Evaluate Pipeline Queue Lock
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTO_MERGE }}
        run: |
          # Lock pipeline if an un-isolated PR currently has auto-merge enabled.
          JQ_QUEUE_LOCK_FILTER='
            .[] | select(
              (.autoMergeRequest != null) and
              (
                all(
                  .labels[].name;
                  . != "failing" and . != "merge-conflict" and . != "ignore"
                )
              )
            ) | .url
          '

          ACTIVE_QUEUE=$(jq -r "$JQ_QUEUE_LOCK_FILTER" /tmp/dependabot_prs.json)

          if [ -n "$ACTIVE_QUEUE" ]; then
            echo "Pipeline locked by active Dependabot PR:"
            echo "$ACTIVE_QUEUE"
            echo "QUEUE_LOCKED=true" >> "$GITHUB_ENV"

            # If master advanced while the active PR's tests ran, request a
            # fresh rebase once all current checks finish.
            JQ_NEEDS_REBASE_FILTER='[
              .[] | select(
                (.autoMergeRequest != null) and
                (
                  .mergeStateStatus == "BEHIND" or
                  .mergeStateStatus == "DIRTY"
                ) and
                # All checks on the current commit have finished.
                (
                  all(
                    .statusCheckRollup[]?;
                    (.status // "COMPLETED") == "COMPLETED" and
                    (.state // "SUCCESS") != "PENDING"
                  )
                ) and
                # No rebase has been requested since the latest commit.
                (
                  (([.commits[]?.committedDate] | last) // "") as $last_commit |
                  all(
                    .comments[]?;
                    (
                      (.body | test("^\\s*@dependabot rebase\\b")) and
                      (.createdAt > $last_commit)
                    ) | not
                  )
                )
              ) | .url
            ] | .[0] // empty'

            REBASE_PR=$(
              jq -r "$JQ_NEEDS_REBASE_FILTER" /tmp/dependabot_prs.json
            )
            if [ -n "$REBASE_PR" ]; then
              echo "Active PR behind master; requesting rebase: $REBASE_PR"
              gh pr comment "$REBASE_PR" --body "@dependabot rebase" || true
            fi
            exit 0
          fi

          # Enforce a 30m (COOLDOWN_SECONDS) pause after the last merged PR.
          RECENTLY_MERGED_PR=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --state merged \
            --limit 5 \
            --json url,mergedAt | \
            jq -r --argjson cooldown "$COOLDOWN_SECONDS" '
              [
                .[] | select(
                  (now - (.mergedAt | fromdateiso8601)) < $cooldown
                )
              ] | .[0].url // empty
            ')

          if [ -n "$RECENTLY_MERGED_PR" ]; then
            echo "Cooldown active (<30m since merge): $RECENTLY_MERGED_PR"
            echo "QUEUE_LOCKED=true" >> "$GITHUB_ENV"
          fi

      # Make the oldest eligible PR ACTIVE: approve it, turn on auto-merge,
      # then post /gcbrun (up to date), merge (already tested), or request a
      # rebase (behind). After a rebase, new-commit-listener posts /gcbrun.
      - name: Dispatch Target PR
        if: env.QUEUE_LOCKED != 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTO_MERGE }}
        run: |
          # Pick the oldest un-isolated candidate PR. Candidates are already
          # sorted oldest-first by the fetch step.
          JQ_TARGET_FILTER='[
            .[] | select(
              all(
                .labels[].name;
                . != "failing" and . != "merge-conflict" and . != "ignore"
              )
            )
          ] | .[0] // empty'

          TARGET_PR_JSON=$(
            jq -c "$JQ_TARGET_FILTER" /tmp/dependabot_prs.json
          )

          if [ -z "$TARGET_PR_JSON" ] || [ "$TARGET_PR_JSON" == "null" ]; then
            echo "No PRs currently eligible for Active processing."
            exit 0
          fi

          PR_URL=$(echo "$TARGET_PR_JSON" | jq -r '.url')
          MERGE_STATE=$(echo "$TARGET_PR_JSON" | jq -r '.mergeStateStatus')
          # Check if /gcbrun already ran on the latest commit before allowing
          # an immediate merge on a CLEAN PR.
          HAS_GCBRUN_ON_HEAD=$(echo "$TARGET_PR_JSON" | jq -r '
            (([.commits[]?.committedDate] | last) // "") as $last_commit |
            any(
              .comments[]?;
              (.body | test("^\\s*/gcbrun\\b")) and
              (.createdAt > $last_commit)
            )
          ')
          echo "Dispatching PR: $PR_URL (mergeStateStatus: $MERGE_STATE)"

          # Approve and enable auto-merge.
          gh pr review --approve "$PR_URL" || true
          gh pr merge --auto --squash "$PR_URL" || true

          # Rebase if behind/conflicted, merge if CLEAN and already tested,
          # otherwise trigger /gcbrun tests.
          if [ "$MERGE_STATE" == "BEHIND" ] || \
             [ "$MERGE_STATE" == "DIRTY" ]; then
            gh pr comment "$PR_URL" --body "@dependabot rebase"
          elif [ "$MERGE_STATE" == "CLEAN" ] && \
               [ "$HAS_GCBRUN_ON_HEAD" == "true" ]; then
            gh pr merge --squash "$PR_URL" || true
          else
            gh pr comment "$PR_URL" --body "/gcbrun"
          fi
