name: Dependabot auto-approve

# Tests and merges Dependabot security update PRs automatically, acting as
# the datacommons-robot-author GitHub account.
#
# ---------------------------------------------------------------------------
# HOW IT WORKS
# ---------------------------------------------------------------------------
# This file has two independent jobs. queue-manager tests and merges
# Dependabot PRs one at a time. new-commit-listener posts /gcbrun when
# Dependabot pushes a new commit to the PR that queue-manager is working on.
#
# * queue-manager (every 30 minutes, or a manual run)
#   Keeps exactly one Dependabot PR ACTIVE (being tested) at a time, marked
#   with the 'dependabot-active' label. Testing several at once would flood
#   Cloud Build, and each merge would make the others out of date anyway.
#   Each run is short: it takes one step for the ACTIVE PR, or starts the
#   next one, and exits. It never waits for tests.
#
# * new-commit-listener (every push to a PR targeting master)
#   When the ACTIVE PR gets a new commit (usually a rebase that
#   queue-manager asked for), posts /gcbrun so Cloud Build tests it right
#   away. If it misses one, queue-manager posts /gcbrun on its next run.
#
# Checks that count: every check on the PR's latest commit except those in
# IGNORED_CHECKS and this workflow's own jobs. Success, neutral (skipped by
# a Cloud Build file filter), and skipped count as passed. This includes
# checks that aren't required on master, such as
# website-pull-request-webdriver.
#
# Each queue-manager run:
#
#   If there is an ACTIVE PR, take the first step below that matches it, in
#   order:
#     * It has commits from someone other than Dependabot: label it
#       'merge-conflict' (Dependabot won't rebase it).
#     * It's still conflicted REBASE_TIMEOUT_SECONDS after a rebase
#       request: label it 'merge-conflict'.
#     * No new commit, robot comment, or start for STUCK_TIMEOUT_SECONDS:
#       label it 'failing' (stuck).
#     * A check that counts failed: label it 'failing'.
#     * It's behind master or conflicted: comment "@dependabot rebase"
#       (once per commit). master only accepts up-to-date PRs.
#     * A check that counts says "Needs /gcbrun" (ACTION_REQUIRED): post
#       /gcbrun (once per commit).
#     * A check that counts still says ACTION_REQUIRED CHECK_WAIT_SECONDS
#       after the commit or /gcbrun: label it 'failing'.
#     * Every check that counts passed, and the commit is at least
#       CHECK_WAIT_SECONDS old (so late checks have reported): approve and
#       merge it.
#     * Otherwise, tests or a rebase are in progress: wait.
#   Labeling a PR 'merge-conflict' or 'failing' also removes
#   'dependabot-active', so it's no longer ACTIVE.
#
#   If there is no ACTIVE PR (or it was just set aside), and no Dependabot
#   PR merged in the last COOLDOWN_SECONDS, label the oldest waiting PR
#   'dependabot-active' and take its first step right away. The cooldown
#   leaves room for other PRs to merge between Dependabot merges.
#
# The robot approves only right before merging, and never turns on GitHub
# auto-merge: auto-merge only waits for checks that are required on master.
#
# Developer interventions:
# * Skip a PR: add the 'ignore' label.
# * Retry a PR: remove 'failing' or 'merge-conflict'. It goes back in line.
# * Start a PR next: if no PR is ACTIVE, add 'dependabot-active' to it.
# * Merge a PR right away: approve and merge it manually in the GitHub UI.
#
# ---------------------------------------------------------------------------
# TOKENS AND PERMISSIONS
# ---------------------------------------------------------------------------
# * Cloud Build only runs tests after a repo collaborator comments /gcbrun.
#   Dependabot and github-actions[bot] (the built-in GITHUB_TOKEN) both
#   count as outsiders, so both jobs act as datacommons-robot-author using
#   its personal access tokens.
# * A run started by a Dependabot push is treated as Dependabot's and can
#   only read Dependabot secrets, so the jobs use separate robot tokens:
#   - queue-manager: Actions secret DEPENDABOT_AUTO_MERGE
#   - new-commit-listener: Dependabot secret ROBOT_TOKEN_NEW_COMMIT_LISTENER
#     (fine-grained, Pull requests read and write only)
#   Rotate each token before it expires.
# * Because new-commit-listener holds a robot token, keep its logic minimal:
#   no actions/checkout, no third-party actions, and no package installs.

on:
  # Starts new-commit-listener on every push to a PR targeting master. The
  # job's `if:` filters down to the ACTIVE Dependabot PR. Runs started by a
  # Dependabot push can only read Dependabot secrets (see TOKENS AND
  # PERMISSIONS).
  pull_request:
    types:
      - synchronize
    branches:
      - master
  # Starts queue-manager every 30 minutes.
  schedule:
    - cron: '*/30 * * * *'
  # Starts queue-manager on a manual run (Actions tab > "Run workflow").
  workflow_dispatch:

# Default GITHUB_TOKEN permissions. Jobs act through robot tokens instead.
permissions:
  contents: read

env:
  # Pause after a Dependabot PR merges before starting the next one.
  COOLDOWN_SECONDS: 1800
  # If Dependabot hasn't resolved a conflict this long after a rebase
  # request, the PR is labeled 'merge-conflict'.
  REBASE_TIMEOUT_SECONDS: 900
  # An ACTIVE PR with no new commit, robot comment, or start for this long
  # is treated as stuck and labeled 'failing'.
  STUCK_TIMEOUT_SECONDS: 7200
  # How long to wait for checks to report after a new commit, and for
  # Cloud Build to accept a /gcbrun.
  CHECK_WAIT_SECONDS: 600
  # Checks that never block a merge or set a PR aside (JSON list of exact
  # check names). website-pull-request-nl fails on most PRs; it's optional
  # on master.
  IGNORED_CHECKS: '["website-pull-request-nl (datcom-ci)"]'

jobs:
  # When the ACTIVE Dependabot PR gets a new commit (usually a rebase that
  # queue-manager asked for), post /gcbrun so Cloud Build tests it.
  new-commit-listener:
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN isn't used; every command uses the robot token.
    permissions: {}
    # Run only for the ACTIVE Dependabot PR. Every other PR push skips this
    # job.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'datacommonsorg/website' &&
      contains(github.event.pull_request.labels.*.name, 'dependabot-active') &&
      !contains(github.event.pull_request.labels.*.name, 'failing') &&
      !contains(github.event.pull_request.labels.*.name, 'merge-conflict') &&
      !contains(github.event.pull_request.labels.*.name, 'ignore')
    steps:
      - name: Post /gcbrun comment for Active PR
        env:
          # Robot token from Dependabot secrets. This run was started by a
          # Dependabot push, so Actions secrets are not available here.
          GH_TOKEN: ${{ secrets.ROBOT_TOKEN_NEW_COMMIT_LISTENER }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr comment "$PR_URL" --body "/gcbrun"

  # Every 30 minutes, move the Dependabot queue forward by one step. Started
  # by the schedule or a person, so it reads its robot token from Actions
  # secrets (DEPENDABOT_AUTO_MERGE).
  queue-manager:
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-approve-and-merge
      cancel-in-progress: false
    permissions:
      pull-requests: write
      contents: write
    if: >-
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch') &&
      github.repository == 'datacommonsorg/website'
    steps:
      - name: Move the Dependabot queue forward
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTO_MERGE }}
          ROBOT_LOGIN: datacommons-robot-author
        run: |
          # Retries a read-only gh command to ride out GraphQL timeouts.
          gh_retry() {
            for ATTEMPT in 1 2 3; do
              if "$@"; then
                return 0
              fi
              sleep $((ATTEMPT * 5))
            done
            echo "Failed after 3 attempts: $*"
            return 1
          }

          # List open Dependabot PRs with lightweight fields only. Fetching
          # statusCheckRollup for every PR at once causes GraphQL timeouts.
          gh_retry gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --limit 1000 \
            --json url,number,createdAt,labels \
            > /tmp/dependabot_prs.json

          # The ACTIVE PR, and the waiting PRs in line (oldest first). PRs
          # labeled 'failing', 'merge-conflict', or 'ignore' are set aside,
          # even if they still have a stale 'dependabot-active' label.
          JQ_NOT_SET_ASIDE='
            all(
              .labels[].name;
              . != "failing" and . != "merge-conflict" and . != "ignore"
            )
          '
          ACTIVE_URL=$(jq -r "
            [ .[] | select($JQ_NOT_SET_ASIDE) |
              select(any(.labels[].name; . == \"dependabot-active\")) ] |
            sort_by(.createdAt) | .[0].url // empty
          " /tmp/dependabot_prs.json)
          WAITING_URLS=$(jq -r "
            [ .[] | select($JQ_NOT_SET_ASIDE) |
              select(all(.labels[].name; . != \"dependabot-active\")) ] |
            sort_by(.createdAt) | .[].url
          " /tmp/dependabot_prs.json)

          # Decides the one step to take for the ACTIVE PR (the first rule
          # that matches; see the header comment). Prints "<step> <reason>".
          # This workflow's own jobs don't count as checks: a failed
          # new-commit-listener run shouldn't set a PR aside, since this job
          # posts /gcbrun itself when one is missing.
          JQ_DECIDE='
            def age($t): $now - ($t | fromdateiso8601);
            def last_commit: ([.commits[]?.committedDate] | max) // .createdAt;
            last_commit as $commit |
            [ .comments[]? | select(.createdAt > $commit) ] as $since_commit |
            ([ $since_commit[] |
               select(.body | test("^\\s*@dependabot rebase\\b")) |
               .createdAt ] | max) as $rebase_at |
            ([ $since_commit[] | select(.body | test("^\\s*/gcbrun\\b")) |
               .createdAt ] | max) as $gcbrun_at |
            ([ $commit, $active_since,
               (.comments[]? | select(.author.login == $robot) | .createdAt)
             ] | map(select(. != null and . != "")) | max) as $progress_at |
            [ .statusCheckRollup[]? |
              select((.name // .context) as $n |
                     any($ignored[]; . == $n) | not) |
              select(.workflowName != $workflow) ] as $checks |
            (.mergeStateStatus == "BEHIND" or .mergeStateStatus == "DIRTY")
              as $behind |
            if any(.commits[]?.authors[]?;
                   (.login // "") | test("^dependabot") | not) then
              "merge-conflict has commits from someone other than Dependabot"
            elif .mergeStateStatus == "DIRTY" and $rebase_at != null and
                 age($rebase_at) > $rebase_timeout then
              "merge-conflict still conflicted after a rebase request"
            elif age($progress_at) > $stuck_timeout then
              "failing no progress (stuck)"
            elif any($checks[];
                     (.conclusion // "") as $c | (.state // "") as $s |
                     ($c | IN("FAILURE", "TIMED_OUT", "CANCELLED",
                              "STARTUP_FAILURE", "ERROR")) or
                     ($s | IN("FAILURE", "ERROR"))) then
              "failing a check failed"
            elif $behind and $rebase_at == null then
              "rebase behind master or conflicted"
            elif $behind or .mergeStateStatus == "UNKNOWN" then
              "wait rebase in progress"
            elif any($checks[]; .conclusion == "ACTION_REQUIRED") and
                 $gcbrun_at == null then
              "gcbrun a check needs /gcbrun"
            elif any($checks[]; .conclusion == "ACTION_REQUIRED") and
                 age([$commit, $gcbrun_at] | max) > $check_wait then
              "failing a check still needs action after /gcbrun"
            elif ($checks | length) > 0 and
                 all($checks[];
                     if .__typename == "StatusContext" then
                       .state == "SUCCESS"
                     else
                       .status == "COMPLETED" and
                       (.conclusion | IN("SUCCESS", "NEUTRAL", "SKIPPED"))
                     end) and
                 age($commit) >= $check_wait then
              "merge every check that counts passed"
            else
              "wait tests in progress"
            end
          '

          # Takes one step for the ACTIVE PR. Clears ACTIVE_URL if the PR
          # was set aside. Sets MERGED=true if it merged.
          step_active_pr() {
            local ACTIVE_SINCE="$1"
            local FIELDS="url,number,createdAt,headRefOid,mergeStateStatus"
            FIELDS="$FIELDS,statusCheckRollup,commits,comments"
            gh_retry gh pr view "$ACTIVE_URL" \
              --repo "$GITHUB_REPOSITORY" \
              --json "$FIELDS" \
              > /tmp/pr.json

            DECISION=$(jq -r \
              --argjson now "$(date +%s)" \
              --arg active_since "$ACTIVE_SINCE" \
              --arg robot "$ROBOT_LOGIN" \
              --arg workflow "$GITHUB_WORKFLOW" \
              --argjson ignored "$IGNORED_CHECKS" \
              --argjson rebase_timeout "$REBASE_TIMEOUT_SECONDS" \
              --argjson stuck_timeout "$STUCK_TIMEOUT_SECONDS" \
              --argjson check_wait "$CHECK_WAIT_SECONDS" \
              "$JQ_DECIDE" /tmp/pr.json)
            echo "$ACTIVE_URL: $DECISION"

            case "${DECISION%% *}" in
              merge-conflict | failing)
                gh pr edit "$ACTIVE_URL" \
                  --add-label "${DECISION%% *}" \
                  --remove-label "dependabot-active"
                ACTIVE_URL=""
                ;;
              rebase)
                gh pr comment "$ACTIVE_URL" --body "@dependabot rebase"
                ;;
              gcbrun)
                gh pr comment "$ACTIVE_URL" --body "/gcbrun"
                ;;
              merge)
                # --match-head-commit refuses to merge if Dependabot pushed
                # a newer, untested commit since the checks were read.
                HEAD_SHA=$(jq -r '.headRefOid' /tmp/pr.json)
                gh pr review --approve "$ACTIVE_URL"
                if gh pr merge --squash \
                  --match-head-commit "$HEAD_SHA" "$ACTIVE_URL"; then
                  gh pr edit "$ACTIVE_URL" --remove-label "dependabot-active"
                  MERGED=true
                else
                  echo "Merge failed; the next run will try again."
                fi
                ;;
            esac
          }

          MERGED=false
          if [ -n "$ACTIVE_URL" ]; then
            # When the PR became ACTIVE, so a PR that was just started isn't
            # treated as stuck because its latest commit is old.
            ACTIVE_SINCE=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues/${ACTIVE_URL##*/}/events" \
              --jq '.[] | select(.event == "labeled" and
                                 .label.name == "dependabot-active") |
                    .created_at' | tail -n 1)
            step_active_pr "$ACTIVE_SINCE"
          fi

          # Start waiting PRs until one stays ACTIVE. A PR can be set aside
          # on its first step (for example, a check already failed on its
          # latest commit). Start at most 5 per run to limit API calls.
          if [ -n "$ACTIVE_URL" ] || [ "$MERGED" = true ]; then
            exit 0
          fi

          gh_retry gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --state merged \
            --limit 5 \
            --json url,mergedAt \
            > /tmp/recently_merged.json
          RECENTLY_MERGED_PR=$(jq -r --argjson cooldown "$COOLDOWN_SECONDS" '
            [
              .[] | select((now - (.mergedAt | fromdateiso8601)) < $cooldown)
            ] | .[0].url // empty
          ' /tmp/recently_merged.json)
          if [ -n "$RECENTLY_MERGED_PR" ]; then
            echo "Cooldown after $RECENTLY_MERGED_PR merged. Not starting a PR."
            exit 0
          fi

          STARTED=0
          for PR_URL in $WAITING_URLS; do
            if [ -n "$ACTIVE_URL" ] || [ "$MERGED" = true ] || \
               [ "$STARTED" -ge 5 ]; then
              break
            fi
            echo "Starting $PR_URL"
            gh pr edit "$PR_URL" --add-label "dependabot-active"
            ACTIVE_URL="$PR_URL"
            STARTED=$((STARTED + 1))
            step_active_pr "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          done
