[project]
name = "datacommons-website-server"
version = "0.1.0"
description = "Data Commons Website Server"
requires-python = ">=3.11,<3.13"
dependencies = [
    "absl-py==1.4.0",
    "authlib==1.9.8",
    "beautifulsoup4==4.12.2",
    "CacheControl==0.12.11",
    "data-gemma",
    "deepdiff==8.6.2",
    "fastapi==0.135.3",
    "flask_cors==6.0.0",
    "flask_testing==0.8.1",
    "Flask-Babel==2.0.0",
    "Flask-Caching==2.0.1",
    "Flask[async]==2.3.3",
    "frozendict==2.3.4",
    "geojson_rewind==1.0.1",
    "google-adk[mcp]==2.14.1",
    "google-api-core>=2.18.0,<3.0.0",
    "google-auth-oauthlib==1.2.0",
    "google-auth==2.62.2",
    "google-cloud-aiplatform==1.165.1",
    "google-cloud-bigtable==2.32.0",
    "google-cloud-core==2.4.1",
    "google-cloud-discoveryengine==0.13.12",
    "google-cloud-language",
    "google-cloud-logging>=3.11.0,<4.0.0",
    "google-cloud-secret-manager==2.22.0",
    "google-cloud-storage==3.0.0",
    "google-genai==2.34.0",
    "gunicorn==23.0.0",
    "jinja2==3.1.6",
    "json5==0.9.14",
    "langdetect==1.0.9",
    "markupsafe==2.1.2",
    "mcp==1.30.0",
    "numpy==2.2.4",
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "parameterized==0.8.1",
    "pillow==13.0.0",
    "protobuf>=4.25.3",
    "pydantic==2.13.5",
    "PyGithub==1.58.2",
    "pyOpenSSL==26.4.0",
    "python-dateutil>=2.9.0.post0, <3.0.0",
    "PyYAML==6.0.2",
    "redis==4.5.4",
    "requests==2.33.0",
    "selenium==4.21.0",
    "starlette==1.10.0",
    "typing-extensions==4.15.0",
    "webdriver-manager==4.0.0",
    "Werkzeug==3.1.9",
]

[dependency-groups]
lint = [
    "isort==5.13.0",
    "yapf==0.40.2",
]
test = [
    "pytest==9.0.3",
    "pytest-flakefinder==1.1.0",
    "pytest-rerunfailures==16.7",
    "pytest-xdist==3.2.1",
]

# Explicitly set pypi index as default for Cloud Build
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
data-gemma = { git = "https://github.com/datacommonsorg/llm-tools.git" }
