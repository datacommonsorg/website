
# Website App Kubernetes Deployment config. (https://kubernetes.io/docs/concepts/workloads/controllers/deployment/)
# This is to be extended by the dev/autopush/staging/prod overlay.
# The deployment contains Flask web server container , gRPC mixer container and ESP container that transcodes grpc to JSON.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-app
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: {{ .Values.website.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- if eq .Values.website.flaskEnv "custom" }}
      # Custom DCs can be completely unavailable for the short
      # period of time while new deployments become ready.
      # In return, we don't need extra compute resources
      # just for new pods during deployment.
      maxSurge: 50%
      maxUnavailable: 100%
      {{ else }}
      # maximum number of Pods that can be created over the desired number of Pods
      # 25% of default pods (+1 in case default < 4)
      maxSurge: {{ div .Values.website.replicas 4 | add 1 }}
      # Maximum number of pods that can be unavailable during the update process
      # 25% of default pods (+1 in case default < 4)
      maxUnavailable: {{ div .Values.website.replicas 4 | add 1 }}
      {{- end }}
  selector:
    matchLabels:
      app: website-app
  template:
    metadata:
      labels:
        app: website-app
      annotations:
        timestamp: {{ now | quote }}
    spec:
      {{- if .Values.website.nodePool }}
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.website.nodePool }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      volumes:
        - name: ingress-config
          configMap:
            name: ingress-config
        {{- if .Values.website.redis.enabled }}
        - name: redis-config
          configMap:
            name: redis-config
        {{- end }}
        - name: blocklist-svg
          configMap:
            name: blocklist-svg
      containers:
        - name: website
          image: "gcr.io/datcom-ci/datacommons-website{{- if .Values.website.image.tag }}:{{ .Values.website.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.website.image.pullPolicy }}
          args: []
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: "4G"
            requests:
              memory: "4G"
          volumeMounts:
            - name: ingress-config
              mountPath: /datacommons/ingress
            {{- if .Values.website.redis.enabled }}
            - name: redis-config
              mountPath: /datacommons/redis
            {{- end }}
            - name: blocklist-svg
              mountPath: /datacommons/svg
          env:
            - name: FLASK_ENV
              value: {{ required "Missing: website.flaskEnv" .Values.website.flaskEnv }}
            - name: WEBSITE_HASH
              value: {{ .Values.website.githash | quote }}
            - name: ENABLE_MODEL
              value: {{ .Values.nl.enabled | quote }}
            - name: ENABLE_DATAGEMMA
              value: {{ .Values.website.dataGemma.enabled | quote }}
            - name: INGRESS_CONFIG_PATH
              value: /datacommons/ingress/rules
            # A dummy config used to bounce the server without any docker image
            # or data config change.
            - name: BOUNCE
              value: "dummy"

{{- if .Values.nodejs.enabled }}
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-nodejs-app
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: {{ .Values.nodejs.replicas}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maximum number of Pods that can be created over the desired number of Pods
      # 25% of default pods (+1 in case default < 4)
      maxSurge: {{ div .Values.nodejs.replicas 4 | add 1 }}
      # Maximum number of pods that can be unavailable during the update process
      # 25% of default pods (+1 in case default < 4)
      maxUnavailable: {{ div .Values.nodejs.replicas 4 | add 1 }}
  selector:
    matchLabels:
      app: website-nodejs-app
  template:
    metadata:
      labels:
        app: website-nodejs-app
      annotations:
        timestamp: {{ now | quote }}
    spec:
      {{- if .Values.nodejs.nodePool }}
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.nodejs.nodePool }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: nodejs
          image: "gcr.io/datcom-ci/datacommons-nodejs{{- if .Values.nodejs.image.tag }}:{{ .Values.nodejs.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.website.image.pullPolicy }}
          args: []
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "2G"
            requests:
              memory: "2G"
          env:
            - name: WEBSITE_HASH
              value: {{ .Values.website.githash | quote }}
            - name: NODE_ENV
              value: {{ .Values.nodejs.env }}
            - name: API_ROOT
              value: {{ .Values.nodejs.apiRoot }}
            # A dummy config used to bounce the server without any docker image
            # or data config change.
            - name: BOUNCE
              value: "dummy"
          startupProbe:
            httpGet:
              path: /nodejs/healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /nodejs/healthz
              port: 8080
            failureThreshold: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nodejs/healthz
              port: 8080
{{- end }}

{{- if .Values.narratives.enabled }}
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-narratives-app
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: {{ .Values.narratives.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ div .Values.narratives.replicas 4 | add 1 }}
      maxUnavailable: {{ div .Values.narratives.replicas 4 | add 1 }}
  selector:
    matchLabels:
      app: website-narratives-app
  template:
    metadata:
      labels:
        app: website-narratives-app
    spec:
      {{- if .Values.narratives.nodePool }}
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.narratives.nodePool }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: narratives
          image: "gcr.io/datcom-ci/datacommons-narratives{{- if .Values.narratives.image.tag }}:{{ .Values.narratives.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.website.image.pullPolicy }}
          args: []
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: {{ .Values.narratives.memory | quote }}
            requests:
              cpu: {{ .Values.narratives.cpu | default "500m" | quote }}
              memory: {{ .Values.narratives.memory | quote }}
          env:
            - name: PORT
              value: "8080"
            - name: BASE_PATH
              value: {{ .Values.narratives.basePath | quote }}
            - name: ENABLE_CHAT
              value: {{ .Values.narratives.enableChat | quote }}
            - name: ALLOWED_ORIGIN
              value: "https://{{ required "Missing: domain" .Values.domain }}"
            - name: MCP_SERVER_URL
              value: {{ .Values.narratives.mcpServerUrl | quote }}
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: {{ .Values.narratives.useVertexAi | quote }}
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.project | quote }}
            - name: GOOGLE_CLOUD_LOCATION
              value: {{ .Values.narratives.cloudLocation | quote }}
            - name: DC_API_KEY_SECRET
              value: {{ .Values.narratives.dcApiKeySecret | quote }}
            - name: TRANSCRIPT_HMAC_SECRET_NAME
              value: {{ .Values.narratives.transcriptHmacSecretName | quote }}
          startupProbe:
            httpGet:
              path: {{ .Values.narratives.basePath }}/healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.narratives.basePath }}/healthz
              port: 8080
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.narratives.basePath }}/healthz
              port: 8080
            periodSeconds: 10
{{- end }}
