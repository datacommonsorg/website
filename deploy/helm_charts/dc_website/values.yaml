# Default values for dc-website.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

###############################################################################
# Config for Website
###############################################################################
website:
  githash:

  image:
    project: "datcom-ci"
    pullPolicy: Always
    tag:

  flaskEnv: "custom"

  # IAP (Identity-Aware Proxy) config for backendconfig (main website only,
  # independent of agentic.iap). Uses custom OAuth credentials in K8s secret
  # `iap-secret` (shared with backendconfig-agentic so both backends share one
  # IAP session cookie on the same domain). When false, spec.iap is omitted so
  # Console-managed IAP is left untouched.
  iap:
    enabled: false

  replicas: 1

  redis:
    enabled: false
    configFile:

  nodePool:

  dataGemma:
    enabled: false

nameOverride: ""
fullnameOverride: ""

# Namespace for the deployment.
# Set enabled to false to deploy into an existing namespace.
namespace:
  create: false
  name: website

# Config for k8s-sa(service account). The k8s-sa will be bound to a
# GCP-sa using annotations, specified below.
serviceAccount:
  name: website-ksa

# Pod and container securityContext (non-root + read-only root filesystem).
securityContext:
  enabled: true

ingress:
  name: website-ingress
  ipName: dc-website-ip
  certName: dc-website-cert
  enabled: false

###############################################################################
# Config for Mixer helm chart
###############################################################################
mixer:
  githash:

  image:
    project: "datcom-ci"
    pullPolicy: Always
    tag: ""

    hostProject:
    serviceName:

    schemaConfigs:

esp:
  image:
    repository: gcr.io/endpoints-release/endpoints-runtime
    tag: "2"
    pullPolicy: Always

kgStoreConfig:
  bigqueryVersion:
  baseBigtableInfo:
  customBigtableInfo: ""

serviceGroups:
  svg:
    urlPaths:
      - "/place/stat-var-group/*"
      - "/stat-var/*"
      - "/v1/variable/*"
      - "/v1/bulk/info/variable-group"
      - "/v2/bulk/info/variable-group"
      - "/v1/bulk/info/variable"
  observation:
    urlPaths:
      - "/v2/observation"
  node:
    urlPaths:
      - "/v2/node"
  default:
    urlPaths:
      - "/*"

###############################################################################
# Config for NL
###############################################################################
nl:
  enabled: false
  image:
    tag: ""
  memory: "2G"
  workers: 1
  catalog: {}
  env:
    default_indexes: []
    enabled_indexes: []
    vertex_ai_models: {}
    enable_reranking: false

###############################################################################
# Config for Stat Var Groups which is shared between Website and Mixer
###############################################################################
svg:
  blocklistFile: []

###############################################################################
# Config for NodeJS Server
###############################################################################
nodejs:
  # If nodejs is enabled, must also enable nl.
  # When enabling the NodeJS server for the first time for a project, need to
  # update the cluster config by following instructions here: https://github.com/datacommonsorg/website/blob/master/gke/README.md
  enabled: false
  image:
    tag: ""
  env: "gke"
  replicas:
  apiRoot:
  nodePool:

###############################################################################
# Config for Cron Testing Job
###############################################################################
cronTesting:
  enabled: false
  # These are the in-cluster service endpoints that are set during script
  # deployment runtime.
  webApiRoot:
  nodejsApiRoot:
  # whether or not sanity tests are enabled
  enableSanity: true
  # whether or not adversarial tests are enabled
  enableAdversarial: true
  # whether or not nodejs query tests are enabled
  enableNodejs: false
  # node pool to use
  nodePool:
  # schedule to run the cron tests on
  schedule:

###############################################################################
# Config for Agentic Apps (e.g. Discover)
###############################################################################
agentic:
  # Set to false to remove the website-agentic-apps Deployment,
  # website-agentic-service Service, and agentic Ingress routes completely.
  enabled: false
  replicas: 2
  nodePool:
  mcpServerUrl: "https://api.datacommons.org/mcp"
  useVertexAi: true
  cloudLocation: "global"
  dcApiKeySecret: "mixer-api-key"
  transcriptHmacSecretName: "agentic-transcript-hmac-secret"
  modelArmorLocation: "us-central1"
  # Optional Cloud Armor security policy name (e.g. "discover-armor-policy")
  # attached to backendconfig-agentic (both single-cluster Helm and MCI).
  # Must be a policy name without "/" (not a full resource URL). When empty,
  # spec.securityPolicy is omitted so Console-managed policies are untouched.
  securityPolicy: ""
  # Optional public reCAPTCHA Enterprise WAF site keys injected into agentic
  # containers (provisioned via gke/setup_recaptcha.sh).
  recaptchaSessionSiteKey: ""
  recaptchaCheckboxSiteKey: ""
  # IAP (Identity-Aware Proxy) config for backendconfig-agentic (independent of
  # website.iap). Shares the custom OAuth credentials in K8s secret `iap-secret`
  # with `website.iap` so browser requests across /labs/discover and
  # /datacommons.js + /api/* share one IAP session cookie on the same domain.
  # When false, spec.iap is omitted so Console-managed IAP is left untouched.
  iap:
    enabled: false
  discover:
    enabled: true
    basePath: "/labs/discover"
    # Turn debug panel mode ("off", "flag", or "on"). Quote values so YAML 1.1
    # does not parse bare on/off as booleans.
    debugReport: "off"
    image:
      tag: ""
    cpu: "1"
    memory: "1G"
    modelArmorTemplateId: ""
    configBucket: ""
