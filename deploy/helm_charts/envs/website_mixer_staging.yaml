# Overrides for datcom-website-staging's bundled dc-mixer Helm release.
# Base defaults come from mixer/deploy/helm_charts/mixer/values.yaml.
#
# Standalone mixer overrides are independent and configured at
# mixer/deploy/helm_charts/envs/mixer_staging.yaml.

# ----------------------------------------------------------------------------
# Read by scripts/deploy_cloud_esp.sh via yq (not used by Helm templates).
project: datcom-website-staging
cluster_prefix: website
# ----------------------------------------------------------------------------

mixer:
  hostProject: datcom-website-staging
  serviceName: website-esp.endpoints.datcom-website-staging.cloud.goog
  redis:
    enabled: true
    configFile: |
      instances:
        - region: "us-central1"
          host: "10.38.211.19"
          port: "6379"
  enableOtlp: true
  enableMcpPreview: true

esp:
  transcodingIgnoreUnknownQueryParameters: true

serviceAccount:
  name: website-ksa

# Bundled Mixer is an internal backend reached via cluster Services, so this
# mixer-ingress-staging resource (referencing standalone Mixer's IP/certs) is unused.
# Follow-up: set enabled: false and remove name/annotations.
ingress:
  enabled: true
  name: mixer-ingress-staging
  annotations:
    {
      ingress.gcp.kubernetes.io/pre-shared-cert: "mixer-certificate,multi-domain-2026,api-esp",
    }

serviceGroups:
  svg:
    replicas: 2
    maxSurge: 0
    nodePool: pool-1
    # Exercises the goMemLimit path before prod; keep ~1GiB below the 6Gi default limit.
    goMemLimit: "5GiB"
  recon: # Follow-up: null
    replicas: 4
  node:
    replicas: 20 # Follow-up: 4
  observation:
    replicas: 10 # Follow-up: 4
  default:
    replicas: 5 # Follow-up: 4
