# Overrides for datcom-website-prod's bundled dc-mixer Helm release.
# Base defaults come from mixer/deploy/helm_charts/mixer/values.yaml.
# Standalone mixer_prod.yaml is not inherited; consider standalone mixer configs when making shared changes.

# Read by scripts/deploy_cloud_esp.sh via yq (not used by Helm templates).
project: datcom-website-prod
cluster_prefix: website

mixer:
  hostProject: datcom-website-prod
  serviceName: website-esp.endpoints.datcom-website-prod.cloud.goog
  redis:
    enabled: true
    configFile: |
      instances:
        - region: "us-central1"
          host: "10.212.232.163"
          port: "6379"
  enableOtlp: true

esp:
  transcodingIgnoreUnknownQueryParameters: true

serviceAccount:
  name: website-ksa

# Bundled Mixer is an internal backend reached via cluster Services, so this
# mixer-ingress-prod resource (referencing standalone Mixer's IP/certs) is unused.
# Follow-up: set enabled: false and remove name/annotations.
ingress:
  enabled: true
  name: mixer-ingress-prod
  annotations:
    {
      ingress.gcp.kubernetes.io/pre-shared-cert: "mixer-certificate,multi-domain-2026,api-esp",
    }

serviceGroups:
  svg:
    replicas: 10
    # Keep goMemLimit ~10% below memoryLimit when changing either value.
    resources:
      memoryRequest: "10Gi"
      memoryLimit: "10Gi"
    goMemLimit: "9GiB"
  recon: # Follow-up: null
    replicas: 90
  node:
    replicas: 60 # Follow-up: 100
  observation:
    replicas: 60 # Follow-up: 100
  default:
    replicas: 30 # Follow-up: 50
