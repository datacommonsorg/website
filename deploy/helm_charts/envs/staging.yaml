# DNS
ip: 35.186.255.58
domain: staging.datacommons.org

# Helm config
project: "datcom-website-staging"
cluster_prefix: "website"

namespace:
  name: "website"

website:
  flaskEnv: staging
  securityPolicy: "botcrawl-throttle"
  replicas: 6
  enableModel: true
  redis:
    enabled: true
    configFile: |
      {
        "us-central1": {
          "host": "10.127.249.59",
          "port": "6379"
        }
      }

mixer:
  serviceName: "website-esp.endpoints.datcom-website-staging.cloud.goog"
  hostProject: "datcom-website-staging"
  redis:
    enabled: true
  enableOtlp: true

ingress:
  enabled: false
  certName: "website-certificate,multi-domain-2026"

serviceAccount:
  name: website-ksa

nl:
  enabled: true
  image:
    tag: ""
  env:
    default_indexes:
      - base_uae_mem
    enabled_indexes:
      - base_uae_mem
      - medium_ft
      - sdg_ft
      - undata_ft
    vertex_ai_models:
      uae-large-v1-model:
        project_id: datcom-nl
        location: us-central1
        prediction_endpoint_id: "8435477397553283072"
    enable_reranking: false

serviceGroups:
  recon: null
  svg:
    replicas: 2
  node:
    replicas: 4
  observation:
    replicas: 4
  default:
    replicas: 4

svg:
  blocklistFile: ["dc/g/Uncategorized", "oecd/g/OECD"]

cronTesting:
  enabled: true
  webApiRoot: "https://staging.datacommons.org"
  enableNodejs: false # skip nodejs tests in staging
  nodePool: "default-pool"
  schedule: "* * 31 2 *" # invalid day for month -> never run automatically

agentic:
  enabled: true
  replicas: 2
  clusterCount: 1
  mcpServerUrl: "https://staging.api.datacommons.org/mcp"
  securityPolicy: "discover-armor-policy"
  recaptchaSessionSiteKey: "6LcuSDIuAAAAAKOl-_3moBhBz1gLmxmkGohzufPj"
  recaptchaCheckboxSiteKey: "6LcUczIuAAAAABxIl8j4I93tnLierJ4Y7ed3dQz1"
  discover:
    debugReport: "off"
    modelArmorTemplateId: "discover-staging"
    configBucket: "datcom-website-staging-discover-config"
    # Environment-wide daily Gemini token cap (10M/day = 5M/pod across 2 pods in 1 cluster).
    dailyTokenBudget: 10000000
    webComponentUrl: "https://staging.datacommons.org/datacommons.js"
    webComponentApiRoot: "https://staging.datacommons.org"
