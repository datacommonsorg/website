# Overrides for datcom-website-dev's bundled dc-mixer Helm release.
# Base defaults come from mixer/deploy/helm_charts/mixer/values.yaml.
# Standalone mixer_dev.yaml is not inherited; consider standalone mixer configs when making shared changes.

# Read by scripts/deploy_cloud_esp.sh via yq (not used by Helm templates).
project: datcom-website-dev
cluster_prefix: website

mixer:
  hostProject: datcom-website-dev
  serviceName: website-esp.endpoints.datcom-website-dev.cloud.goog
  useBaseBigtable: false
  useBranchBigtable: false
  useBigquery: false
  useSpannerGraph: true
  redis:
    enabled: true
    configFile: |
      instances:
        - region: "us-central1"
          host: "10.60.165.235"
          port: "6379"
  enableOtlp: true
  enableMcpPreview: true

esp:
  transcodingIgnoreUnknownQueryParameters: true

serviceAccount:
  name: website-ksa

# Bundled Mixer is an internal backend reached via cluster Services, so this
# mixer-ingress-dev resource (referencing standalone Mixer's IP/cert) is unused.
# Follow-up: set enabled: false and remove name/annotations.
ingress:
  enabled: true
  name: mixer-ingress-dev
  annotations:
    {
      kubernetes.io/ingress.global-static-ip-name: mixer-ip,
      ingress.gcp.kubernetes.io/pre-shared-cert: mixer-certificate,
    }

serviceGroups:
  svg:
    replicas: 2 # Follow-up: 1
    resources:
      memoryRequest: "4G"
      memoryLimit: "4G"
  recon: # Follow-up: null
    replicas: 4
  observation:
    replicas: 4 # Follow-up: 3
  node:
    replicas: 4 # Follow-up: 3
    resources:
      memoryRequest: "4G"
      memoryLimit: "4G"
  default:
    replicas: 2 # Follow-up: 3
